[project]
site_name = "PDFFile"
site_url = "https://pdffile.readthedocs.io/"
site_author = "AJ"
site_description = "A ZipFile like API for PDFs"
nav = ["NEWS.md"]
docs_dir = "docs"

[project.theme]
variant = "modern"
features = ["content.code.copy", "navigation.footer", "search.highlight"]

[project.theme.palette]
scheme = "slate"

[project.markdown_extensions]
smarty = {}
toc.permalink = true

[project.plugins.minify]
minify_html = true
minify_inline_js = true
minify_inline_css = true

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.api-autonav]
modules = ["pdffile"]
